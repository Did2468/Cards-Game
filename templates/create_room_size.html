<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Deck Size - Cricket Card Battle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

.bg-glow {
    position: fixed; top: 50%; left: 50%;
    width: 800px; height: 800px;
    background: radial-gradient(circle, rgba(103, 184, 95, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
    transform: translate(-50%, -50%); z-index: -1; pointer-events: none;
}

body {
    background-color: #0b0f19; color: #ffffff;
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
    font-family: "Segoe UI", sans-serif;
}

.container {
    width: 90%; max-width: 550px; background: rgba(30, 41, 59, 0.6);
    padding: 50px; border-radius: 18px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    animation: slideUp 0.5s ease forwards; opacity: 0;
}

@keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

h1 { color: #67b85f; font-size: 2.2rem; margin-bottom: 15px; }
p { color: #94a3b8; margin-bottom: 8px; font-size: 1.05rem; }
.max-cards { font-weight: 600; color: #2e7d32; margin-bottom: 25px; }

input[type="number"] {
    width: 220px; padding: 14px; font-size: 1.2rem; text-align: center;
    border: 2px solid #475569; background: #1e293b; color: white;
    border-radius: 10px; margin-bottom: 25px; outline: none; transition: 0.2s;
}

input[type="number"]:focus { border-color: #2e7d32; }

.btn {
    background: #2e7d32; color: white; padding: 15px 35px;
    font-size: 1rem; font-weight: 600; border: none; border-radius: 10px;
    cursor: pointer; transition: all 0.2s ease;
}

.btn:hover { background: #1b5e20; transform: translateY(-2px); }
.back-link { display: block; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
</style>
</head>

<body>
    <div class="bg-glow"></div>

    <div class="container">
        <h1>Room Setup</h1>
        <p>Selected Theme: <strong style="color: #67b85f;">{{ deck_theme.upper() }}</strong></p>

        <p>How many cards do u want to play with?</p>
        <p class="max-cards">(Maximum: {{ max_cards }})</p>

        <form method="POST" action="/mp/handle_create">
            <!-- Hidden input forwards theme selection -->
            <input type="hidden" name="deck_theme" value="{{ deck_theme }}">

            <input
                type="number"
                name="deck_size"
                min="2"
                max="{{ max_cards }}"
                value="10">

            <br>

            <button type="submit" class="btn">
                Create Room & Generate Code!
            </button>
        </form>

        <a href="/mp/create" class="back-link">← Change Theme</a>
    </div>

</body>
</html>
