<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Complete - Cricket Card Battle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background-color: #0b0f19;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

.container {
    width: 90%;
    max-width: 480px;
    background: rgba(30, 41, 59, 0.6);
    padding: 40px;
    border-radius: 18px;
    text-align: center;
}

h1 { color: #67b85f; font-size: 2.5rem; margin-bottom: 10px; }

.btn {
    display: inline-block;
    background: #2e7d32;
    color: white;
    padding: 14px 30px;
    border-radius: 10px;
    text-decoration: none;
    margin-top: 25px;
    font-weight: 600;
}
</style>
</head>
<body>

<div class="container">
    <h1>{{ result_title }}</h1>
    <p style="color: #cbd5e1; margin-top: 10px;">{{ message }}</p>

    <a href="/" class="btn">Return to Home</a>
</div>

</body>
</html>
