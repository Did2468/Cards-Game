<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Cricket Card Battle</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Abstract Premium Background */
.bg-glow {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(103, 184, 95, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
    transform: translate(-50%, -50%);
    z-index: -1;
    pointer-events: none;
}

body {
    background-color: #0b0f19;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

.container {
    width: 90%;
    max-width: 480px;
    background: rgba(30, 41, 59, 0.6);
    padding: 40px 45px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

.logo {
    font-size: 50px;
    margin-bottom: 10px;
}

h1 {
    color: #67b85f;
    font-size: 2.2rem;
    margin-bottom: 8px;
}

p.subtitle {
    color: #94a3b8;
    font-size: 0.95rem;
    margin-bottom: 25px;
}

/* Error Message Box */
.error-msg {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #f87171;
    padding: 10px 15px;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-bottom: 20px;
}

/* Form Group Styles */
.form-group {
    text-align: left;
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    color: #cbd5e1;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 8px;
}

.form-group input {
    width: 100%;
    padding: 12px 16px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    color: #ffffff;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s ease;
}

.form-group input:focus {
    border-color: #67b85f;
}

/* Button Styles */
.btn {
    display: inline-block;
    width: 100%;
    background: #2e7d32;
    color: white;
    border: none;
    font-size: 1.05rem;
    font-weight: 600;
    padding: 14px 20px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
}

.btn:hover {
    background: #1b5e20;
    transform: translateY(-2px);
}

.btn:active {
    transform: translateY(0);
}

.btn-secondary {
    background: #334155;
    margin-top: 12px;
}

.btn-secondary:hover {
    background: #475569;
}

.divider {
    margin: 20px 0;
    border-top: 1px solid #334155;
}

.footer-link {
    display: inline-block;
    margin-top: 15px;
    color: #94a3b8;
    text-decoration: none;
    font-size: 0.85rem;
}

.footer-link:hover {
    color: #ffffff;
}
</style>
</head>

<body>
    <div class="bg-glow"></div>

<div class="container">
    <div class="logo">🏏</div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Log in</p>

    <!-- Error Alert Message -->
    {% if error %}
        <div class="error-msg">
            {{ error }}
        </div>
    {% endif %}

    <!-- Form posts directly to your /handle_login route -->
    <form action="/login-handle" method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn">Log In</button>
    </form>

    <div class="divider"></div>

    <p style="color: #94a3b8; font-size: 0.9rem;">Don't have an account?</p>
    <a href="/register" class="btn btn-secondary">Create Account</a>

    <a href="/" class="footer-link">← Back to Home</a>
</div>

</body>
</html>
