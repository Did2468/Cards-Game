<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cricket Card Battle</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Abstract Premium Background */
.bg-glow {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(103, 184, 95, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
    transform: translate(-50%, -50%);
    z-index: -1;
    pointer-events: none;
}

body {
    background-color: #0b0f19;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

.container {
    position: relative;
    width: 90%;
    max-width: 550px;
    background: rgba(30, 41, 59, 0.6);
    padding: 50px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

/* Top Right User Profile Badge */
.profile-bar {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(15, 23, 42, 0.6);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.85rem;
    color: #cbd5e1;
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.profile-blob {
    width: 8px;
    height: 8px;
    background-color: #ffffff;
    border-radius: 50%;
    display: inline-block;
}

.logo {
    font-size: 70px;
    margin-bottom: 15px;
    margin-top: 10px;
}

h1 {
    color: #67b85f;
    font-size: 2.8rem;
    margin-bottom: 12px;
}

p {
    color: #94a3b8;
    font-size: 1.05rem;
    line-height: 1.6;
    margin-bottom: 30px;
}

/* Error Message Banner */
.error-msg {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #f87171;
    padding: 10px 15px;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-bottom: 20px;
}

.action-buttons {
    display: flex;
    flex-direction: column;
    gap: 15px;
    align-items: center;
    margin-bottom: 20px;
}

.btn {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    background: #2e7d32;
    color: white;
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 600;
    padding: 14px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
}

.btn:hover {
    background: #1b5e20;
    transform: translateY(-2px);
}

.btn:active {
    transform: translateY(0);
}

.btn-blue {
    background: #1e3a8a;
}

.btn-blue:hover {
    background: #1e40af;
}

.btn-cyan {
    background: #0284c7;
}

.btn-cyan:hover {
    background: #0369a1;
}

/* Inline Join Form Controls */
.join-box {
    width: 100%;
    display: flex;
    gap: 10px;
}

.join-input {
    flex: 1;
    padding: 12px 16px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    color: #ffffff;
    font-size: 1rem;
    outline: none;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 600;
    transition: border-color 0.2s ease;
}

.join-input:focus {
    border-color: #0284c7;
}

.divider {
    width: 100%;
    margin: 5px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.footer {
    margin-top: 25px;
    color: #94a3b8;
    font-size: 0.9rem;
}
</style>
</head>

<body>
    <div class="bg-glow"></div>

<div class="container">
    <!-- Top-Right Profile Section -->
    <div class="profile-bar">
        <span class="profile-blob"></span>
        <span>{{ user.username }}</span>
    </div>

    <div class="logo">🏏</div>

    <h1>Cricket Card Battle</h1>

    <p>
        Relive your childhood nostalgia online.
    </p>

    {% if error %}
        <div class="error-msg">
            {{ error }}
        </div>
    {% endif %}

    <div class="action-buttons">
        <!-- Single Player Mode -->
        <a href="/toss" class="btn">
            Play vs Computer
        </a>
        <a href="/ultimate_team" class="btn">
            Deck Building
        </a>

        <div class="divider"></div>

        <!-- Multiplayer Mode -->
        <a href="/mp/create" class="btn btn-blue">
    		Create Room
	</a>
        <div class="divider"></div>
	<form action="/mp/handle_join" method="POST" class="join-box">
            <input type="text" name="room_code" class="join-input" placeholder="ROOM CODE" maxlength="6" required>
            <button type="submit" class="btn btn-cyan" style="width: auto; padding: 12px 24px;">
                Join
            </button>
        </form>
        <!-- Account Routes -->
        {% if user.is_guest %}
            <a href="/login" class="btn" style="background: #334155;">
                Login to Account
            </a>
            <a href="/register" class="btn" style="background: #334155;">
                Register Account
            </a>
        {% endif %}
    </div>

    <div class="footer">
        Single Player & PvP Multiplayer
    </div>
</div>

</body>
</html>
