<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cricket Card Battle</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Abstract Premium Background */
.bg-glow {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(103, 184, 95, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
    transform: translate(-50%, -50%);
    z-index: -1;
    pointer-events: none;
}

body {
    background-color: #0b0f19;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

.container {
    position: relative; /* Enables absolute positioning for top-right profile bar */
    width: 90%;
    max-width: 550px;
    background: rgba(30, 41, 59, 0.6);
    padding: 50px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

/* Top Right User Profile Badge */
.profile-bar {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(15, 23, 42, 0.6);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.85rem;
    color: #cbd5e1;
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.profile-blob {
    width: 8px;
    height: 8px;
    background-color: #ffffff;
    border-radius: 50%;
    display: inline-block;
}

.logo {
    font-size: 70px;
    margin-bottom: 15px;
    margin-top: 10px;
}

h1 {
    color: #67b85f;
    font-size: 2.8rem;
    margin-bottom: 12px;
}

p {
    color: #94a3b8;
    font-size: 1.05rem;
    line-height: 1.6;
    margin-bottom: 35px;
}

.btn {
    display: inline-block;
    width: 100%;
    background: #2e7d32;
    color: white;
    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 600;
    padding: 15px 35px;
    border-radius: 10px;
    transition: all 0.2s ease;
}

.btn:hover {
    background: #1b5e20;
    transform: translateY(-2px);
}

.btn:active {
    transform: translateY(0);
}

.footer {
    margin-top: 25px;
    color: #94a3b8;
    font-size: 0.9rem;
}

.action-buttons {
    display: flex;
    flex-direction: column;
    gap: 15px;
    align-items: center;
    margin-bottom: 20px;
}
</style>
</head>

<body>
    <div class="bg-glow"></div>

<div class="container">
    <!-- Top-Right Profile Section -->
    <div class="profile-bar">
        <span class="profile-blob"></span>
        <span>{{ user.username }}</span>
    </div>

    <div class="logo">🏏</div>

    <h1>Cricket Card Battle</h1>

    <p>
        Relive Your childhood nostalgia now online.
        Online Cricket Card Battler.
    </p>

    <div class="action-buttons">
        <a href="/toss" class="btn">
            Play vs Computer
        </a>
        <a href="/ultimate_team" class="btn">
           Deck building
        </a>
        <a href="/login" class="btn">
            Login to the account	
        </a>
        <a href="/register" class="btn">
            Register your account
        </a>
    </div>

    <div class="footer">
        Single Player Mode
    </div>
</div>

</body>
</html>
