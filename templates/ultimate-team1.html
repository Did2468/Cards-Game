<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Squad</title>

    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    
    /* Abstract Premium Background */
    .bg-glow {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 800px;
        height: 800px;
        background: radial-gradient(circle, rgba(103, 184, 95, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
        transform: translate(-50%, -50%);
        z-index: -1;
        pointer-events: none;
    }

body {
    background-color: #0b0f19;
    color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", sans-serif;
        
        
        padding: 40px 20px;
    }

    .form-card {
        background: rgba(255, 255, 255, 0.95);
        padding: 35px 40px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        width: 100%;
        max-width: 850px;
        color: #1f3d21;
    }

    h2 {
        font-size: 2.2rem;
        font-weight: 700;
        text-align: center;
        margin-bottom: 25px;
        color: #1f3d21;
    }

    .squad-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }

    .player-slot {
        display: flex;
        flex-direction: column;
    }

    .player-slot label {
        font-size: 0.95rem;
        font-weight: 600;
        color: #444;
        margin-bottom: 6px;
    }

    .player-search-input {
        width: 100%;
        padding: 12px 16px;
        font-size: 1rem;
        border: 2px solid #cce3ce;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.9);
        outline: none;
        transition: all 0.2s ease;
    }

    .player-search-input:focus {
        border-color: #2e7d32;
        box-shadow: 0 0 8px rgba(46, 125, 50, 0.2);
    }

    .actions-container {
        display: flex;
        justify-content: center;
        margin-top: 10px;
    }

    .btn {
        background: #2e7d32;
        color: white;
        padding: 15px 50px;
        font-size: 1.1rem;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
    }

    .btn:hover {
        background: #1b5e20;
        transform: translateY(-2px);
    }

    .btn:active {
        transform: translateY(0);
    }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <form action="/start_game_ultimate" method="POST" class="form-card">
        
        <h2>Select Your 12 Players</h2>
        
        <div class="squad-grid">
            {% for i in range(1, 13) %}
            <div class="player-slot">
                <label for="search-{{ i }}">Player {{ i }}</label>
                
                <input type="text" 
                       id="search-{{ i }}"
                       class="player-search-input" 
                       placeholder="Type to search player..." 
                       list="players-datalist" 
                       autocomplete="off"
                       oninput="updatePlayerId(this, 'hidden-id-{{ i }}')">
                
                <input type="hidden" id="hidden-id-{{ i }}" name="player_ids">
            </div>
            {% endfor %}
        </div>

        <div class="actions-container">
            <button type="submit" class="btn">Submit Selected Squad</button>
        </div>

    </form>

    <datalist id="players-datalist">
        {% for player_id, player in cards.items() %}
            <option data-id="{{ player_id }}" value="{{ player.name }} — {{ player.team }}">
        {% endfor %}
    </datalist>

    <script>
    function updatePlayerId(inputElement, hiddenInputId) {
        const dataList = document.getElementById('players-datalist');
        const hiddenInput = document.getElementById(hiddenInputId);
        
        const option = dataList.querySelector(`option[value="${inputElement.value}"]`);
        
        if (option) {
            hiddenInput.value = option.dataset.id;
        } else {
            hiddenInput.value = "";
        }
    }
    </script>

</body>
</html>
