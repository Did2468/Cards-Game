<!DOCTYPE html>
<html lang="en">
<head>
    <title>Waiting for Friend</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to bottom, #dff2ff 0%, #5ba854 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2c3e50;
        }
        .lobby-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .code {
            font-size: 3.5rem;
            font-weight: 800;
            color: #2e7d32;
            letter-spacing: 5px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="lobby-card">
        <h2>Ultimate Team Matchmaking</h2>
        <p>Share this code with your friend:</p>
        <div class="code">{{ room_code }}</div>
        <p id="status-text">Waiting for opponent to join...</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.min.js"></script>
    <script>
        const socket = io();
        
        // Let the backend know we are waiting inside this room channel
        socket.emit('connect_to_lobby', {
            room_code: "{{ room_code }}",
            role: "{{ role }}"
        });

        // When the server emits 'start_match_redirect', move to the play screen
        socket.on('start_match_redirect', function() {
            window.location.href = "/play";
        });
    </script>
</body>
</html>
