<!DOCTYPE html>
<html>
<head>

<title>Game Over</title>

<style>

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}



    /* Abstract Premium Background */
    .bg-glow {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 800px;
        height: 800px;
        background: radial-gradient(circle, rgba(103, 184, 95, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
        transform: translate(-50%, -50%);
        z-index: -1;
        pointer-events: none;
    }

body {
    background-color: #0b0f19;
    color: #ffffff;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:"Segoe UI", sans-serif;

    

    padding:20px;

    

}



.container {

    width:100%;
    max-width:420px;

    background: rgba(30, 41, 59, 0.6);

    padding:35px 25px;

    border-radius:22px;

    text-align:center;

    border:4px solid #e0b52c;

    box-shadow:

        0 15px 35px rgba(0,0,0,.3);

}





.trophy {

    font-size:70px;

    margin-bottom:15px;

}





.winner {

    font-size:2.8rem;

    font-weight:900;

    color:#67b85f;

    margin-bottom:15px;


}



.message {

    background:#1e293b;

    padding:15px;

    border-radius:12px;

    color:#94a3b8;

    margin-bottom:25px;

    font-size:1.1rem;

}




button {


    background:#f4c542;

    color:#222;


    border:none;

    padding:15px 35px;


    font-size:1.1rem;

    font-weight:800;


    border-radius:25px;


    cursor:pointer;


    transition:.2s;


}



button:hover {

    background:#ffca28;

    transform:translateY(-3px);

}


button:active {

    transform:scale(.97);

}



a {

    text-decoration:none;

}



</style>

</head>


<body>
    <div class="bg-glow"></div>



<div class="container">


<div class="trophy">
🏆
</div>



<div class="winner">

{{winner}} WON!

</div>



<div class="message">

{{messsage}}

</div>



<a href="/">

<button>
Play Again
</button>

</a>



</div>



</body>
</html>
